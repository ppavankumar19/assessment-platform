<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assessment Portal</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div style="min-height:100vh; display:flex; flex-direction:column;">
  <!-- Top nav -->
  <nav style="background:var(--bg-800);border-bottom:1px solid var(--border);padding:.75rem 1.5rem;display:flex;align-items:center;justify-content:space-between;">
    <div class="flex items-center gap-2">
      <span style="color:var(--indigo-400);font-size:1.25rem">&#9670;</span>
      <span style="font-weight:700;font-size:1rem">Assessment Platform</span>
    </div>
    <div id="nav-user" class="flex items-center gap-2"></div>
  </nav>

  <!-- Hero -->
  <div style="background:linear-gradient(135deg,var(--bg-900),var(--bg-800));padding:3rem 1.5rem;text-align:center;border-bottom:1px solid var(--border);">
    <h1 style="font-size:2rem;margin-bottom:.75rem">Assessment Portal</h1>
    <p class="text-muted">Select an assessment to begin your test</p>
  </div>

  <!-- Rounds grid -->
  <main style="max-width:900px;margin:2rem auto;padding:0 1.5rem;width:100%;flex:1">
    <div id="rounds-grid">
      <div class="empty-state"><div class="spinner"></div></div>
    </div>
  </main>

  <footer style="text-align:center;padding:1.5rem;color:var(--text-500);font-size:.8125rem;border-top:1px solid var(--border);">
    Assessment Platform &copy; 2025
  </footer>
</div>

<script type="module">
import api from '/js/api.js'
import { roundTypeBadge } from '/js/utils.js'

// Check if admin is logged in
const token = localStorage.getItem('admin_token')
const navUser = document.getElementById('nav-user')

if (token) {
  try {
    const res = await fetch('/api/auth/user', { headers: { Authorization: `Bearer ${token}` } })
    if (res.ok) {
      const u = await res.json()
      navUser.innerHTML = `
        <span class="text-sm text-muted">${escHtml(u.full_name || u.email)}</span>
        <a href="/admin/" class="btn btn-outline btn-sm">Admin Panel</a>
      `
    }
  } catch {}
}

async function loadRounds() {
  try {
    const rounds = await api.getPublicRounds()
    const grid = document.getElementById('rounds-grid')

    if (!rounds.length) {
      grid.innerHTML = `<div class="empty-state"><div class="icon">&#128203;</div><p>No assessments are currently available.</p></div>`
      return
    }

    grid.innerHTML = `<div style="display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))">` +
      rounds.map(r => `
        <div class="round-card">
          <div class="round-card-header">
            <span class="round-card-title">${escHtml(r.title)}</span>
            ${r.is_active
              ? `<span class="badge badge-green">&#9679; Active</span>`
              : `<span class="badge badge-amber">Paused</span>`}
          </div>
          ${r.description ? `<p class="text-sm mb-3">${escHtml(r.description)}</p>` : ''}
          <div class="flex items-center gap-2 mb-4">
            ${roundTypeBadge(r.round_type)}
            <span class="text-sm text-muted">&#128337; ${r.duration_minutes} minutes</span>
          </div>
          ${r.is_active
            ? `<a href="/test/entry.html?round=${r.id}" class="btn btn-primary w-full">Start Assessment</a>`
            : `<button class="btn btn-ghost w-full" disabled>Currently Paused</button>`}
        </div>
      `).join('') + `</div>`
  } catch (e) {
    document.getElementById('rounds-grid').innerHTML = `<div class="empty-state"><p style="color:var(--red-400)">Failed to load assessments: ${escHtml(e.message)}</p></div>`
  }
}

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}

await loadRounds()
</script>
</body>
</html>
