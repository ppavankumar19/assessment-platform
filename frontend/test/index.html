<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assessment Portal</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body style="background:var(--bg-950)">
<div style="min-height:100vh;display:flex;flex-direction:column;">

  <!-- Nav -->
  <nav style="background:var(--bg-800);border-bottom:1px solid var(--border);padding:.75rem 1.5rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;">
    <div class="flex items-center gap-2">
      <div style="display:inline-flex;align-items:center;justify-content:center;width:1.75rem;height:1.75rem;background:linear-gradient(135deg,var(--indigo-700),var(--indigo-500));border-radius:var(--radius);font-size:.7rem;color:#fff;">&#9670;</div>
      <span style="font-weight:700;font-size:.9375rem;letter-spacing:-.01em">Assessment Platform</span>
    </div>
    <div id="nav-user" class="flex items-center gap-2"></div>
  </nav>

  <!-- Hero -->
  <div style="background:linear-gradient(160deg,var(--bg-900) 0%,var(--bg-800) 100%);border-bottom:1px solid var(--border);padding:3rem 1.5rem;text-align:center;position:relative;overflow:hidden;">
    <div style="position:absolute;inset:0;background-image:linear-gradient(rgba(59,130,246,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(59,130,246,.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;"></div>
    <div style="position:relative">
      <div style="display:inline-flex;align-items:center;gap:.5rem;background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.2);border-radius:var(--radius-full);padding:.25rem .875rem;font-size:.75rem;font-weight:600;color:var(--indigo-400);margin-bottom:1rem;letter-spacing:.03em;">
        &#9679; OPEN ASSESSMENTS
      </div>
      <h1 style="font-size:2rem;margin-bottom:.625rem;">Select Your Assessment</h1>
      <p style="color:var(--text-400);font-size:.9375rem;max-width:460px;margin:0 auto;">Choose an active assessment below. Make sure you have enough time to complete it before starting.</p>
    </div>
  </div>

  <!-- Rounds -->
  <main style="max-width:960px;margin:2rem auto;padding:0 1.5rem;width:100%;flex:1">
    <div id="rounds-grid">
      <div class="empty-state"><div class="spinner"></div></div>
    </div>
  </main>

  <footer style="text-align:center;padding:1.25rem;color:var(--text-500);font-size:.75rem;border-top:1px solid var(--border);">
    Assessment Platform &copy; 2026 &nbsp;&middot;&nbsp; Secure &middot; Proctored &middot; Browser-based
  </footer>
</div>

<script type="module">
import api from '/js/api.js'
import { roundTypeBadge } from '/js/utils.js'

const token = localStorage.getItem('admin_token')
const navUser = document.getElementById('nav-user')

if (token) {
  try {
    const res = await fetch('/api/auth/user', { headers: { Authorization: `Bearer ${token}` } })
    if (res.ok) {
      const u = await res.json()
      navUser.innerHTML = `
        <span class="text-sm text-muted">${escHtml(u.full_name || u.email)}</span>
        <a href="/admin/" class="btn btn-outline btn-sm">Admin Panel</a>
      `
    }
  } catch {}
}

async function loadRounds() {
  try {
    const rounds = await api.getPublicRounds()
    const grid = document.getElementById('rounds-grid')

    if (!rounds.length) {
      grid.innerHTML = `
        <div class="empty-state">
          <div class="icon">&#128203;</div>
          <p style="font-size:.9375rem;font-weight:500;color:var(--text-300);margin-bottom:.25rem">No active assessments</p>
          <p style="font-size:.875rem;">Check back later or contact your administrator.</p>
        </div>`
      return
    }

    grid.innerHTML = `<div style="display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">` +
      rounds.map(r => `
        <div class="round-card">
          <div class="round-card-header">
            <span class="round-card-title">${escHtml(r.title)}</span>
            ${r.is_active
              ? `<span class="badge badge-green">&#9679; Live</span>`
              : `<span class="badge badge-amber">Paused</span>`}
          </div>
          ${r.description ? `<p class="text-sm mb-3" style="line-height:1.55">${escHtml(r.description)}</p>` : ''}
          <div class="flex items-center gap-2 mb-4" style="flex-wrap:wrap">
            ${roundTypeBadge(r.round_type)}
            <span class="badge badge-gray">&#128337; ${r.duration_minutes} min</span>
          </div>
          ${r.is_active
            ? `<a href="/test/entry.html?round=${r.id}" class="btn btn-primary w-full" style="font-size:.9375rem">
                 Start Assessment &rarr;
               </a>`
            : `<button class="btn btn-ghost w-full" disabled>Currently Paused</button>`}
        </div>
      `).join('') + `</div>`
  } catch (e) {
    document.getElementById('rounds-grid').innerHTML = `
      <div class="empty-state">
        <p style="color:var(--red-400)">Failed to load assessments: ${escHtml(e.message)}</p>
      </div>`
  }
}

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}

await loadRounds()
</script>
</body>
</html>
