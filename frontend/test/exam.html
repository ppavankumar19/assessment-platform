<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam — Assessment Platform</title>
  <link rel="stylesheet" href="/css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
  <style>
    /* ── Exam-specific ── */
    .q-dot[disabled] { cursor: not-allowed !important; opacity: .55; pointer-events: none; }
    .q-dot.answered  { background: rgba(4,120,87,.1); color: var(--green-600); border-color: rgba(4,120,87,.25); }
    .q-dot.submitted { background: rgba(37,99,235,.12); color: var(--indigo-600); border-color: rgba(37,99,235,.3); }

    /* Left panel sections */
    .left-code-area {
      flex: 0 0 75%;
      min-height: 0;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      position: relative;
      margin-bottom: .75rem;
    }
    .left-tc-area {
      flex: 0 0 25%;
      min-height: 0;
      overflow-y: auto;
    }
    .exam-panel-left-inner {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }
    .exam-panel-left {
      overflow: hidden !important;
    }

    /* MCQ options */
    .mcq-option {
      display: flex; align-items: flex-start; gap: .875rem;
      padding: .875rem 1rem; border-radius: var(--radius-lg);
      border: 2px solid var(--border); cursor: pointer;
      transition: all .15s; margin-bottom: .5rem;
      background: var(--bg-800);
    }
    .mcq-option:hover { border-color: var(--indigo-500); background: rgba(37,99,235,.03); }
    .mcq-option.selected { border-color: var(--indigo-500); background: rgba(37,99,235,.06); }
    .mcq-option.correct  { border-color: var(--green-500); background: rgba(5,150,105,.06); }
    .mcq-option.wrong    { border-color: var(--red-400); background: rgba(220,38,38,.04); }
    .mcq-label {
      width: 1.75rem; height: 1.75rem; border-radius: var(--radius-full);
      background: var(--bg-750); border: 1.5px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: .8125rem; font-weight: 700; flex-shrink: 0;
      color: var(--text-400); transition: all .15s;
    }
    .mcq-option.selected .mcq-label { background: var(--indigo-600); border-color: var(--indigo-600); color: #fff; }
    .mcq-option.correct  .mcq-label { background: var(--green-600); border-color: var(--green-600); color: #fff; }
    .mcq-option.wrong    .mcq-label { background: var(--red-500); border-color: var(--red-500); color: #fff; }
    .mcq-option-text { font-size: .9375rem; line-height: 1.5; color: var(--text-100); padding-top: .1rem; }

    /* Output prediction */
    .pred-case {
      background: var(--bg-800); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: .875rem; margin-bottom: .625rem;
    }
    .pred-case-header {
      font-size: .75rem; font-weight: 600; color: var(--text-400);
      text-transform: uppercase; letter-spacing: .06em; margin-bottom: .5rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    .pred-input-disp {
      background: var(--bg-750); border: 1px solid var(--border); border-radius: var(--radius);
      padding: .375rem .625rem; font-family: 'JetBrains Mono', monospace;
      font-size: .8125rem; color: var(--text-300); white-space: pre-wrap;
      max-height: 4rem; overflow-y: auto; margin-bottom: .5rem;
    }
    .pred-textarea {
      width: 100%; padding: .5rem .75rem;
      border: 1.5px solid var(--border); border-radius: var(--radius);
      font-family: 'JetBrains Mono', monospace; font-size: .8125rem;
      background: var(--bg-800); color: var(--text-100); resize: vertical;
      min-height: 3rem; outline: none; transition: border-color .15s;
    }
    .pred-textarea:focus { border-color: var(--indigo-500); box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
    .pred-textarea:disabled { opacity: .65; background: var(--bg-750); }
    .pred-result-match { color: var(--green-600); font-weight: 600; font-size: .8125rem; }
    .pred-result-miss  { color: var(--red-500);   font-weight: 600; font-size: .8125rem; }

    /* Right panel toolbar */
    .answer-panel-header {
      padding: .625rem .875rem;
      background: var(--bg-800); border-bottom: 1px solid var(--border);
      font-size: .8125rem; font-weight: 600; color: var(--text-300);
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }

    /* Result summary bar */
    .result-summary {
      padding: .625rem .875rem;
      border-radius: var(--radius);
      font-size: .875rem; font-weight: 600;
      margin-bottom: .75rem; display: flex; align-items: center; gap: .625rem;
    }

    /* tc count strip */
    .tc-count-strip {
      display: flex; gap: .5rem; flex-wrap: wrap;
      padding: .5rem .875rem;
      background: var(--bg-750); border-top: 1px solid var(--border);
      font-size: .75rem; flex-shrink: 0;
    }

    .hidden { display:none !important; }

    /* Locked overlay */
    .locked-overlay {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,.8); backdrop-filter: blur(2px); z-index: 5;
      border-radius: var(--radius); font-size: .875rem; color: var(--text-400);
      flex-direction: column; gap: .5rem; pointer-events: none;
    }
  </style>
</head>
<body>
<div class="exam-layout">

  <!-- Top bar -->
  <div class="exam-topbar">
    <div class="exam-topbar-inner">
      <div class="flex items-center gap-3">
        <div class="exam-brand">
          <div class="exam-brand-icon">&#9670;</div>
          <span class="exam-brand-name">Assessment</span>
        </div>
        <div style="width:1px;height:1.125rem;background:var(--border)"></div>
        <span class="badge badge-indigo" id="q-progress">Q 1 / 1</span>
        <span class="badge badge-gray" id="round-type-badge">—</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="badge badge-gray" id="q-points">—</span>
        <div class="timer-display-box">
          <span style="font-size:.8125rem;color:var(--text-400)">&#9201;</span>
          <span class="timer-text timer-normal-text" id="timer-display">—:——</span>
        </div>
      </div>
    </div>
    <div class="timer-bar-wrap"><div class="timer-bar timer-normal" id="timer-bar" style="width:100%"></div></div>
    <div class="progress-bar-wrap"><div class="progress-bar" id="q-progress-bar" style="width:0%"></div></div>
  </div>

  <!-- Main split -->
  <div class="exam-main">

    <!-- Left: problem statement (and code for OP) -->
    <div class="exam-panel-left" id="exam-panel-left">
      <div class="exam-panel-left-inner">
        <!-- Question header (always visible) -->
        <div style="flex-shrink:0;padding:1rem 1.25rem .75rem;border-bottom:1px solid var(--border)">
          <div class="flex items-center gap-2 mb-1">
            <span class="badge badge-gray" id="q-num-badge" style="font-size:.75rem">Q1</span>
            <h2 id="q-title" style="font-size:1.0625rem;font-weight:600;color:var(--text-50);line-height:1.3">Loading...</h2>
          </div>
          <p id="q-desc" class="text-sm" style="color:var(--text-300);line-height:1.65;white-space:pre-wrap;margin-top:.375rem"></p>
        </div>

        <!-- Code area (Output Prediction only) — 75% height -->
        <div class="left-code-area" id="code-area-wrap" style="flex:3;display:flex;flex-direction:column;margin:.75rem .875rem 0">
          <div style="background:var(--bg-750);border-bottom:1px solid var(--border);padding:.375rem .75rem;font-size:.75rem;font-weight:600;color:var(--text-400);letter-spacing:.05em;text-transform:uppercase;flex-shrink:0">Code Snippet</div>
          <div id="code-editor-container" style="flex:1;min-height:0"></div>
          <div class="locked-overlay hidden" id="code-locked"></div>
        </div>

        <!-- Visible test case inputs (Output Prediction only) — 25% -->
        <div class="left-tc-area" id="tc-inputs-wrap" style="flex:1;padding:.5rem .875rem .75rem">
          <div style="font-size:.6875rem;font-weight:600;color:var(--text-400);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.375rem">Test Inputs</div>
          <div id="tc-inputs-list"></div>
        </div>

        <!-- MCQ only: description block (no code) -->
        <div id="mcq-left-body" class="hidden" style="flex:1;overflow-y:auto;padding:.75rem 1.25rem"></div>

        <!-- Question dots (always at bottom) -->
        <div style="flex-shrink:0;padding:.625rem 1rem;border-top:1px solid var(--border)">
          <div class="q-dots" id="q-dots"></div>
        </div>
      </div>
    </div>

    <!-- Right: answer area -->
    <div class="exam-panel-right" id="exam-panel-right">
      <div class="answer-panel-header" id="answer-panel-header">
        <span id="answer-label">Your Answer</span>
        <span id="answer-status" style="font-size:.8125rem;color:var(--text-400)"></span>
      </div>

      <!-- MCQ answer area -->
      <div id="mcq-answer-area" class="hidden" style="flex:1;overflow-y:auto;padding:1rem .875rem">
        <div id="mcq-options-list"></div>
        <button class="btn btn-success w-full mt-4" id="btn-submit-mcq" style="padding:.625rem">&#10003; Submit Answer</button>
        <div id="mcq-result-area" class="mt-3"></div>
      </div>

      <!-- Output Prediction answer area -->
      <div id="op-answer-area" class="hidden" style="flex:1;overflow-y:auto;padding:1rem .875rem">
        <div id="op-pred-list"></div>
        <button class="btn btn-success w-full mt-3" id="btn-submit-op" style="padding:.625rem">&#10003; Submit Predictions</button>
        <div id="op-result-area" class="mt-3"></div>
      </div>
    </div>
  </div>

  <!-- Bottom nav -->
  <div class="exam-bottombar">
    <button class="btn btn-ghost btn-sm" id="btn-prev">&#8592; Prev</button>
    <div class="flex items-center gap-2">
      <button class="btn btn-ghost btn-sm hidden" id="btn-next">Next &#8594;</button>
      <button class="btn btn-danger btn-sm hidden" id="btn-finish">&#10003; Finish Assessment</button>
    </div>
  </div>
</div>

<!-- Finish Assessment confirm -->
<div class="modal-backdrop" id="modal-finish">
  <div class="modal" style="max-width:420px">
    <div class="modal-header">
      <span class="modal-title">Finish Assessment?</span>
    </div>
    <div class="info-box warning mb-4" style="font-size:.875rem;padding:.75rem 1rem;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.2);color:var(--amber-500);border-radius:var(--radius);line-height:1.6" id="finish-warning"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="modal-finish-cancel">Cancel</button>
      <button class="btn btn-danger" id="modal-finish-ok">&#10003; Finish Assessment</button>
    </div>
  </div>
</div>

<script type="module">
import api from '/js/api.js'
import { toastSuccess, toastError, toastWarning, formatTime, loadTestSession } from '/js/utils.js'

// ── Session ──
const params  = new URLSearchParams(location.search)
const roundId = params.get('round')
const session = loadTestSession(roundId)

if (!session?.session_id || !session?.expires_at) {
  window.location.replace('/test/')
  throw 0
}

// ── State ──
let questions     = []
let currentIdx    = 0
let answers       = {}   // {qid: {type:'mcq', selected:'A'} | {type:'op', predictions:{caseId: text}}}
let submitted     = new Set()
let results       = {}   // {qid: server response}
let hasCompleted  = false
let isSubmitting  = false
let monacoEditor  = null
let monacoReady   = false

const roundType = session.round_type || 'output_prediction'

// ── Auto fullscreen ──
;(async () => {
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen()
    }
  } catch {}
})()

// ── Monaco for code display (Output Prediction) ──
if (roundType === 'output_prediction') {
  require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' } })
  require(['vs/editor/editor.main'], () => {
    monacoEditor = monaco.editor.create(document.getElementById('code-editor-container'), {
      value:               '// Loading...',
      language:            'python',
      theme:               'vs',
      fontSize:            13,
      minimap:             { enabled: false },
      scrollBeyondLastLine: false,
      wordWrap:            'on',
      lineNumbers:         'on',
      readOnly:            true,
      padding:             { top: 8 },
      contextmenu:         true,
      copyWithSyntaxHighlighting: false,
      fontFamily:          "'JetBrains Mono', 'Fira Code', monospace",
      fontLigatures:       true,
    })
    monacoReady = true
    // Render current question once editor is ready
    if (questions.length) renderQuestion(currentIdx)
  })
} else {
  // MCQ: hide code area
  document.getElementById('code-area-wrap').style.display = 'none'
  document.getElementById('tc-inputs-wrap').style.display = 'none'
  document.getElementById('mcq-left-body').classList.remove('hidden')
  monacoReady = true
}

// ── Load questions ──
async function loadQuestions() {
  try {
    questions = await api.getQuestions(roundId, session.session_token)
    if (!questions.length) { toastError('No questions available'); return }
    renderQuestion(0)
    renderDots()
    startTimer()
    startStatusPoller()
    updateButtons()

    // Set round type badge
    const rtLabel = roundType === 'mcq' ? 'MCQ' : 'Output Prediction'
    document.getElementById('round-type-badge').textContent = rtLabel
  } catch (e) {
    toastError('Failed to load questions: ' + e.message)
  }
}

// ── Render question ──
function renderQuestion(idx) {
  currentIdx = idx
  const q = questions[idx]
  if (!q) return

  document.getElementById('q-title').textContent    = q.title
  document.getElementById('q-desc').textContent     = q.description || ''
  document.getElementById('q-points').textContent   = `${q.points} pts`
  document.getElementById('q-progress').textContent = `Q ${idx+1} / ${questions.length}`
  document.getElementById('q-num-badge').textContent = `Q${idx+1}`
  document.getElementById('q-progress-bar').style.width = `${((idx+1)/questions.length)*100}%`

  const isLocked = submitted.has(q.id)
  document.getElementById('answer-status').textContent = isLocked ? '&#128274; Locked' : ''

  if (q.question_type === 'mcq') {
    renderMCQQuestion(q, isLocked)
  } else {
    renderOPQuestion(q, isLocked)
  }

  updateButtons()
  updateDots()
}

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
}

function renderMCQQuestion(q, isLocked) {
  // Show MCQ areas
  document.getElementById('mcq-answer-area').classList.remove('hidden')
  document.getElementById('op-answer-area').classList.add('hidden')
  document.getElementById('code-area-wrap').style.display = 'none'
  document.getElementById('tc-inputs-wrap').style.display = 'none'
  document.getElementById('mcq-left-body').classList.remove('hidden')
  document.getElementById('mcq-left-body').innerHTML = ''  // nothing extra on left for MCQ

  const opts = q.mcq_options || []
  const savedAns = answers[q.id]?.selected || null
  const result   = results[q.id]

  document.getElementById('answer-label').textContent = 'Select your answer'
  document.getElementById('btn-submit-mcq').classList.toggle('hidden', isLocked)

  const list = document.getElementById('mcq-options-list')
  list.innerHTML = opts.map(opt => {
    let cls = 'mcq-option'
    if (isLocked && result) {
      if (result.test_results?.is_correct && savedAns === opt.label) cls += ' correct'
      else if (!result.test_results?.is_correct && savedAns === opt.label) cls += ' wrong'
    } else if (savedAns === opt.label) {
      cls += ' selected'
    }
    return `
      <div class="${cls}" data-option="${opt.label}" ${isLocked ? '' : 'onclick="selectMCQ(this)"'}>
        <div class="mcq-label">${escHtml(opt.label)}</div>
        <div class="mcq-option-text">${escHtml(opt.text)}</div>
      </div>`
  }).join('')

  const resultArea = document.getElementById('mcq-result-area')
  if (isLocked && result) {
    const correct = result.test_results?.is_correct
    resultArea.innerHTML = correct
      ? `<div class="result-summary" style="background:rgba(5,150,105,.08);border:1px solid rgba(5,150,105,.2);color:var(--green-600)">&#10004; Correct! <span style="margin-left:auto;font-size:.875rem">+${result.score} pts</span></div>`
      : `<div class="result-summary" style="background:rgba(220,38,38,.05);border:1px solid rgba(220,38,38,.15);color:var(--red-500)">&#10008; Incorrect <span style="margin-left:auto;font-size:.875rem">0 pts</span></div>`
  } else {
    resultArea.innerHTML = ''
  }
}

function renderOPQuestion(q, isLocked) {
  // Show OP areas
  document.getElementById('mcq-answer-area').classList.add('hidden')
  document.getElementById('op-answer-area').classList.remove('hidden')
  document.getElementById('mcq-left-body').classList.add('hidden')

  const codeWrap = document.getElementById('code-area-wrap')
  const tcWrap   = document.getElementById('tc-inputs-wrap')
  codeWrap.style.display = ''
  tcWrap.style.display   = ''

  // Set code in Monaco (detect language from content)
  const code = q.starter_code || '# No code provided'
  const lang = code.includes('#include') ? 'c' : code.includes('def ') || code.includes('print') ? 'python' : 'cpp'
  if (monacoReady && monacoEditor) {
    monacoEditor.setValue(code)
    monaco.editor.setModelLanguage(monacoEditor.getModel(), lang)
  }

  // Visible test case inputs on left
  const visible = q.test_cases?.filter(tc => !tc.is_hidden) || []
  const hidden  = (q.test_cases?.length || 0) - visible.length
  const tcInputs = document.getElementById('tc-inputs-list')

  if (visible.length === 0) {
    tcInputs.innerHTML = `<p class="text-xs text-muted">No visible test cases.</p>`
  } else {
    tcInputs.innerHTML = visible.map((tc, i) => `
      <div style="margin-bottom:.375rem;padding:.375rem .5rem;background:var(--bg-750);border:1px solid var(--border);border-radius:var(--radius)">
        <span style="font-size:.6875rem;color:var(--text-400);font-weight:600;margin-right:.375rem">Case ${i+1}:</span>
        <span style="font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--text-200)">${escHtml(tc.input || '(empty)')}</span>
      </div>`).join('')
  }

  // Right side: prediction text areas
  document.getElementById('answer-label').textContent = 'Predict the Output'
  document.getElementById('btn-submit-op').classList.toggle('hidden', isLocked)

  const savedPreds = answers[q.id]?.predictions || {}
  const result     = results[q.id]

  if (visible.length === 0) {
    document.getElementById('op-pred-list').innerHTML = `<p class="text-sm text-muted">No visible test cases to predict.</p>`
  } else {
    document.getElementById('op-pred-list').innerHTML = visible.map((tc, i) => {
      const predText = savedPreds[tc.id] || ''
      const tcResult = result?.test_results?.find?.(r => r.case_id === tc.id)
      const locked   = isLocked

      let resultBadge = ''
      if (locked && tcResult) {
        resultBadge = tcResult.matched
          ? `<span class="pred-result-match">&#10004; Correct (+${tcResult.score} pts)</span>`
          : `<span class="pred-result-miss">&#10008; Incorrect</span>`
      }

      return `
        <div class="pred-case" data-case-id="${tc.id}">
          <div class="pred-case-header">
            <span>Test Case ${i+1}  <span style="font-weight:400;color:var(--text-500)">(${tc.points} pts)</span></span>
            ${resultBadge}
          </div>
          <div style="font-size:.6875rem;color:var(--text-500);margin-bottom:.25rem">Input:</div>
          <div class="pred-input-disp">${escHtml(tc.input || '(empty)')}</div>
          <div style="font-size:.6875rem;color:var(--text-500);margin-bottom:.25rem">Your Prediction:</div>
          <textarea class="pred-textarea" data-case-id="${tc.id}"
            placeholder="Type the expected output..."
            ${locked ? 'disabled' : ''}>${escHtml(predText)}</textarea>
          ${locked && tcResult && !tcResult.matched ? `<div style="font-size:.75rem;color:var(--text-400);margin-top:.25rem">Expected: <code style="font-size:.75rem">${escHtml(tcResult.expected)}</code></div>` : ''}
        </div>`
    }).join('')

    // Save predictions on input
    if (!isLocked) {
      document.querySelectorAll('#op-pred-list .pred-textarea').forEach(ta => {
        ta.addEventListener('input', () => {
          const caseId = ta.dataset.caseId
          if (!answers[q.id]) answers[q.id] = { type: 'output_prediction', predictions: {} }
          answers[q.id].predictions[caseId] = ta.value
        })
      })
    }
  }

  // Result summary
  const resultArea = document.getElementById('op-result-area')
  if (isLocked && result) {
    const passed = (result.test_results||[]).filter(r => r.matched).length
    const total  = result.test_results?.length || 0
    resultArea.innerHTML = `
      <div class="result-summary" style="background:${passed===total ? 'rgba(5,150,105,.08)' : 'rgba(217,119,6,.08)'};border:1px solid ${passed===total ? 'rgba(5,150,105,.2)' : 'rgba(217,119,6,.2)'};color:${passed===total ? 'var(--green-600)' : 'var(--amber-500)'}">
        ${passed===total ? '&#10004;' : '&#9888;'} ${passed}/${total} predictions correct
        <span style="margin-left:auto">Score: ${result.score} pts</span>
      </div>`
  } else {
    resultArea.innerHTML = ''
  }
}

// ── MCQ option click ──
window.selectMCQ = (el) => {
  const q = questions[currentIdx]
  if (!q || submitted.has(q.id)) return
  document.querySelectorAll('.mcq-option').forEach(o => o.classList.remove('selected'))
  el.classList.add('selected')
  if (!answers[q.id]) answers[q.id] = { type: 'mcq', selected: null }
  answers[q.id].selected = el.dataset.option
}

// ── Submit MCQ ──
document.getElementById('btn-submit-mcq').addEventListener('click', async () => {
  const q = questions[currentIdx]
  if (!q || submitted.has(q.id) || isSubmitting) return
  const ans = answers[q.id]
  if (!ans?.selected) { toastWarning('Please select an answer first.'); return }

  isSubmitting = true
  updateButtons()
  try {
    const res = await api.submitAnswer({
      session_token:   session.session_token,
      question_id:     q.id,
      answer_type:     'mcq',
      selected_option: ans.selected,
      is_final:        true,
    })
    if (res.error) { toastError(res.error); return }
    results[q.id] = res
    submitted.add(q.id)
    toastSuccess(`Q${currentIdx+1} submitted · Score: ${res.score}/${q.points}`)
    renderQuestion(currentIdx)
    autoAdvance()
  } catch (err) { toastError('Submit failed: ' + err.message) }
  finally { isSubmitting = false; updateButtons() }
})

// ── Submit Output Prediction ──
document.getElementById('btn-submit-op').addEventListener('click', async () => {
  const q = questions[currentIdx]
  if (!q || submitted.has(q.id) || isSubmitting) return

  const visible = q.test_cases?.filter(tc => !tc.is_hidden) || []
  if (visible.length === 0) { toastWarning('No test cases to submit.'); return }

  // Collect predictions from textareas
  const predictions = visible.map(tc => {
    const ta = document.querySelector(`.pred-textarea[data-case-id="${tc.id}"]`)
    return { case_id: tc.id, predicted: ta?.value || '' }
  })

  const hasAny = predictions.some(p => p.predicted.trim() !== '')
  if (!hasAny) { toastWarning('Please enter at least one prediction.'); return }

  isSubmitting = true
  updateButtons()
  try {
    const res = await api.submitAnswer({
      session_token:    session.session_token,
      question_id:      q.id,
      answer_type:      'output_prediction',
      predictions,
      is_final:         true,
    })
    if (res.error) { toastError(res.error); return }
    results[q.id] = res
    submitted.add(q.id)
    if (!answers[q.id]) answers[q.id] = { type: 'output_prediction', predictions: {} }
    predictions.forEach(p => { answers[q.id].predictions[p.case_id] = p.predicted })
    const passed = (res.test_results||[]).filter(r => r.matched).length
    const total  = res.test_results?.length || 0
    toastSuccess(`Q${currentIdx+1} submitted · ${passed}/${total} correct · ${res.score} pts`)
    renderQuestion(currentIdx)
    autoAdvance()
  } catch (err) { toastError('Submit failed: ' + err.message) }
  finally { isSubmitting = false; updateButtons() }
})

function autoAdvance() {
  const nextIdx = findNextUnsubmitted(currentIdx)
  if (nextIdx >= 0) setTimeout(() => renderQuestion(nextIdx), 400)
}

// ── Navigation ──
function findPrevUnsubmitted(from) {
  for (let i = from - 1; i >= 0; i--) {
    if (!submitted.has(questions[i].id)) return i
  }
  return -1
}
function findNextUnsubmitted(from) {
  for (let i = from + 1; i < questions.length; i++) {
    if (!submitted.has(questions[i].id)) return i
  }
  return -1
}

function updateButtons() {
  if (!questions.length) return
  const unsubCount = questions.filter(q => !submitted.has(q.id)).length
  const prevIdx    = findPrevUnsubmitted(currentIdx)
  const nextIdx    = findNextUnsubmitted(currentIdx)

  document.getElementById('btn-prev').disabled = prevIdx < 0
  document.getElementById('btn-next').classList.toggle('hidden', nextIdx < 0)

  const finishBtn = document.getElementById('btn-finish')
  finishBtn.classList.toggle('hidden', questions.length === 0)
  finishBtn.textContent = unsubCount > 0
    ? `Finish Assessment (${unsubCount} unanswered)`
    : '&#10003; Finish Assessment'

  // Disable submit buttons if already submitting
  const mcqBtn = document.getElementById('btn-submit-mcq')
  const opBtn  = document.getElementById('btn-submit-op')
  if (mcqBtn) mcqBtn.disabled = isSubmitting
  if (opBtn)  opBtn.disabled  = isSubmitting
}

document.getElementById('btn-prev').addEventListener('click', () => {
  const i = findPrevUnsubmitted(currentIdx)
  if (i >= 0) renderQuestion(i)
})
document.getElementById('btn-next').addEventListener('click', () => {
  const i = findNextUnsubmitted(currentIdx)
  if (i >= 0) renderQuestion(i)
})

// ── Question dots ──
function renderDots() {
  const el = document.getElementById('q-dots')
  el.innerHTML = questions.map((q,i) => `
    <button class="q-dot ${i===currentIdx ? 'active' : ''} ${submitted.has(q.id) ? 'submitted' : (answers[q.id] ? 'answered' : '')}"
      data-idx="${i}" title="Q${i+1}: ${q.title}">${i+1}</button>
  `).join('')
  el.querySelectorAll('.q-dot').forEach(btn => {
    btn.addEventListener('click', () => renderQuestion(Number(btn.dataset.idx)))
  })
}
function updateDots() {
  document.querySelectorAll('.q-dot').forEach((btn, i) => {
    const q = questions[i]
    btn.className = `q-dot ${i===currentIdx ? 'active' : ''} ${submitted.has(q.id) ? 'submitted' : (answers[q.id] ? 'answered' : '')}`
  })
}

// ── Timer ──
function startTimer() {
  const expiry = new Date(session.expires_at).getTime()
  const total  = expiry - Date.now()
  function tick() {
    const remaining = expiry - Date.now()
    if (remaining <= 0) { setTimer(0, total); autoSubmitAll('timer_expired'); return }
    setTimer(remaining, total)
    requestAnimationFrame(() => setTimeout(tick, 1000))
  }
  tick()
}
function setTimer(remaining, total) {
  const pct = total > 0 ? (remaining / total) * 100 : 0
  const isCritical = remaining <= 60000
  const isWarning  = remaining <= 300000
  document.getElementById('timer-display').textContent = formatTime(remaining)
  document.getElementById('timer-display').className =
    `timer-text ${isCritical ? 'timer-critical-text' : isWarning ? 'timer-warning-text' : 'timer-normal-text'}`
  const bar = document.getElementById('timer-bar')
  bar.style.width = `${pct}%`
  bar.className   = `timer-bar ${isCritical ? 'timer-critical' : isWarning ? 'timer-warning' : 'timer-normal'}`
}

// ── Status polling ──
function startStatusPoller() {
  const iv = setInterval(async () => {
    if (hasCompleted) { clearInterval(iv); return }
    try {
      const data = await api.getSessionStatus(session.session_id, session.session_token)
      if (data.status === 'disqualified' || data.status === 'completed') {
        clearInterval(iv)
        if (!hasCompleted) {
          hasCompleted = true
          document.exitFullscreen().catch(() => {})
          window.location.replace(`/test/complete.html?round=${roundId}`)
        }
      }
    } catch {}
  }, 10000)
}

// ── Anti-cheat ──
document.addEventListener('visibilitychange', () => { if (document.hidden) handleViolation('tab_switch') })
document.addEventListener('fullscreenchange',  () => { if (!document.fullscreenElement) handleViolation('fullscreen_exit') })
window.addEventListener('beforeunload', e => { e.preventDefault(); e.returnValue = '' })
document.addEventListener('keydown', e => { if ((e.ctrlKey && e.key==='u') || e.key==='F12') e.preventDefault() })

async function handleViolation(reason) {
  if (isSubmitting || hasCompleted) return
  try { await api.logEvent(session.session_id, session.session_token, reason, { timestamp: Date.now() }) } catch {}
  if (!hasCompleted) {
    hasCompleted = true
    isSubmitting = true
    await submitAllUnanswered()
    document.exitFullscreen().catch(() => {})
    window.location.replace(`/test/complete.html?round=${roundId}`)
  }
}

async function autoSubmitAll(reason) {
  if (isSubmitting || hasCompleted) return
  isSubmitting = true
  hasCompleted = true
  try { await api.logEvent(session.session_id, session.session_token, reason, {}) } catch {}
  await submitAllUnanswered()
  document.exitFullscreen().catch(() => {})
  window.location.replace(`/test/complete.html?round=${roundId}`)
}

async function submitAllUnanswered() {
  for (const q of questions) {
    if (submitted.has(q.id)) continue
    const ans = answers[q.id]
    if (!ans) continue
    try {
      if (q.question_type === 'mcq' && ans.selected) {
        await api.submitAnswer({ session_token: session.session_token, question_id: q.id, answer_type: 'mcq', selected_option: ans.selected, is_final: true })
      } else if (q.question_type === 'output_prediction' && ans.predictions) {
        const preds = Object.entries(ans.predictions).map(([case_id, predicted]) => ({ case_id, predicted }))
        if (preds.length) await api.submitAnswer({ session_token: session.session_token, question_id: q.id, answer_type: 'output_prediction', predictions: preds, is_final: true })
      }
    } catch {}
  }
  try { await api.completeSession(session.session_id, session.session_token) } catch {}
}

// ── Finish Assessment ──
document.getElementById('btn-finish').addEventListener('click', () => {
  const unsubCount = questions.filter(q => !submitted.has(q.id)).length
  document.getElementById('finish-warning').innerHTML = unsubCount > 0
    ? `<strong>${unsubCount} question${unsubCount>1?'s':''} unanswered</strong>. Unanswered questions will score 0. Are you sure?`
    : 'All questions answered. Ready to submit your assessment?'
  document.getElementById('modal-finish').classList.add('open')
})
document.getElementById('modal-finish-cancel').addEventListener('click', () => {
  document.getElementById('modal-finish').classList.remove('open')
})
document.getElementById('modal-finish-ok').addEventListener('click', async () => {
  if (hasCompleted) return
  hasCompleted = true
  const btn = document.getElementById('modal-finish-ok')
  btn.disabled = true
  btn.innerHTML = '<span class="spinner" style="width:10px;height:10px;border-width:1.5px;display:inline-block;vertical-align:middle;margin-right:6px"></span> Finishing...'
  document.getElementById('modal-finish').classList.remove('open')
  await submitAllUnanswered()
  document.exitFullscreen().catch(() => {})
  window.location.replace(`/test/complete.html?round=${roundId}`)
})

// ── Start ──
await loadQuestions()
</script>
