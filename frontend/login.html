<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Assessment Platform</title>
  <link rel="stylesheet" href="/css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon">&#9670;</div>
      <h1>Assessment Platform</h1>
      <p>Admin Portal — Sign in to continue</p>
    </div>

    <!-- Access-denied error (shown when a non-admin account logs in) -->
    <div id="access-error" style="display:none;background:rgba(220,38,38,.06);border:1px solid rgba(220,38,38,.2);border-radius:var(--radius-lg);padding:.75rem 1rem;margin-bottom:1rem;font-size:.875rem;color:var(--red-500);text-align:center;">
      &#10007; Access denied — your account does not have admin privileges.
    </div>

    <button class="btn-google" id="btn-google">
      <svg width="18" height="18" viewBox="0 0 18 18">
        <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615Z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18Z"/>
        <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332Z"/>
        <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58Z"/>
      </svg>
      Continue with Google
    </button>

    <div class="divider">or sign in with email</div>

    <div class="form-group">
      <label for="email-input">Email address</label>
      <input type="email" id="email-input" class="input" placeholder="admin@example.com" autocomplete="email">
    </div>
    <button class="btn-magic" id="btn-magic">Send Magic Link</button>
    <div class="magic-sent" id="magic-sent">
      &#10003; Check your inbox — a login link has been sent.
    </div>

    <p style="text-align:center;margin-top:1.5rem;font-size:.8125rem;">
      <a href="/test/" style="color:var(--text-400);">Candidate portal &rarr;</a>
    </p>
  </div>
</div>

<script type="module">
  const SUPABASE_URL  = 'https://copzdszelljcxkdhalio.supabase.co'
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNvcHpkc3plbGxqY3hrZGhhbGlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5OTg0NjgsImV4cCI6MjA5NjU3NDQ2OH0.C_tGzKaG6udyuKgJ7SpQPBJMVIpfWX5bJZSy1cgWT1E'

  const { createClient } = window.supabase
  const client = createClient(SUPABASE_URL, SUPABASE_ANON, {
    auth: { detectSessionInUrl: true },
  })

  // Verify the token is an admin token before redirecting.
  // /api/auth/user returns 200 only for role='admin', 403 otherwise.
  async function checkAndRedirect(accessToken) {
    const res = await fetch('/api/auth/user', {
      headers: { Authorization: `Bearer ${accessToken}` },
    })
    if (res.ok) {
      localStorage.setItem('admin_token', accessToken)
      window.location.replace('/admin/')
    } else {
      // Signed in but not an admin — sign them out and show error
      localStorage.removeItem('admin_token')
      await client.auth.signOut()
      document.getElementById('access-error').style.display = 'block'
      document.getElementById('btn-google').disabled = false
    }
  }

  // If there's already a valid Supabase session (e.g. returning after OAuth redirect)
  const { data: { session } } = await client.auth.getSession()
  if (session?.access_token) {
    await checkAndRedirect(session.access_token)
  }

  // Listen for new sign-in events
  client.auth.onAuthStateChange(async (_event, s) => {
    if (s?.access_token) {
      await checkAndRedirect(s.access_token)
    }
  })

  document.getElementById('btn-google').addEventListener('click', async () => {
    document.getElementById('access-error').style.display = 'none'
    document.getElementById('btn-google').disabled = true
    await client.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.origin + '/login.html' },
    })
  })

  document.getElementById('btn-magic').addEventListener('click', async () => {
    const email = document.getElementById('email-input').value.trim()
    if (!email) return alert('Please enter your email.')

    document.getElementById('access-error').style.display = 'none'
    const btn = document.getElementById('btn-magic')
    btn.disabled = true
    btn.textContent = 'Sending...'

    const { error } = await client.auth.signInWithOtp({
      email,
      options: { emailRedirectTo: window.location.origin + '/login.html' },
    })

    if (error) {
      btn.disabled = false
      btn.textContent = 'Send Magic Link'
      alert(error.message)
    } else {
      document.getElementById('magic-sent').style.display = 'block'
      btn.style.display = 'none'
    }
  })
</script>
</body>
</html>
