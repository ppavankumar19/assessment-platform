<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Assessment Platform</title>
  <link rel="stylesheet" href="/css/app.css">
  <!-- Supabase JS via CDN for OAuth -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-logo">
        <h1>&#9670; Assessment</h1>
        <p>Admin Portal</p>
      </div>

      <!-- Google OAuth -->
      <button class="btn-google" id="btn-google">
        <svg width="18" height="18" viewBox="0 0 18 18">
          <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615Z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18Z"/>
          <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332Z"/>
          <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58Z"/>
        </svg>
        Continue with Google
      </button>

      <div class="divider">or</div>

      <!-- Magic link -->
      <div class="form-group">
        <label for="email-input">Email address</label>
        <input type="email" id="email-input" class="input" placeholder="admin@example.com">
      </div>
      <button class="btn-magic" id="btn-magic">Send Magic Link</button>
      <div class="magic-sent" id="magic-sent">
        Check your inbox — a login link has been sent.
      </div>

      <p style="text-align:center;margin-top:1.5rem;">
        <a href="/test/" style="color:var(--text-400);font-size:0.8125rem;">Go to candidate portal →</a>
      </p>
    </div>
  </div>

  <script type="module">
    const SUPABASE_URL  = 'https://copzdszelljcxkdhalio.supabase.co'
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNvcHpkc3plbGxqY3hrZGhhbGlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5OTg0NjgsImV4cCI6MjA5NjU3NDQ2OH0.C_tGzKaG6udyuKgJ7SpQPBJMVIpfWX5bJZSy1cgWT1E'

    const { createClient } = window.supabase
    const client = createClient(SUPABASE_URL, SUPABASE_ANON, {
      auth: { detectSessionInUrl: true },
    })

    // Handle OAuth callback — Supabase auto-exchanges the code
    const { data: { session } } = await client.auth.getSession()
    if (session?.access_token) {
      localStorage.setItem('admin_token', session.access_token)
      window.location.replace('/admin/')
    }

    // Listen for auth state change (covers magic link flow)
    client.auth.onAuthStateChange((_event, s) => {
      if (s?.access_token) {
        localStorage.setItem('admin_token', s.access_token)
        window.location.replace('/admin/')
      }
    })

    // Google OAuth
    document.getElementById('btn-google').addEventListener('click', async () => {
      await client.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin + '/login.html' },
      })
    })

    // Magic link
    document.getElementById('btn-magic').addEventListener('click', async () => {
      const email = document.getElementById('email-input').value.trim()
      if (!email) return alert('Please enter your email.')

      const btn = document.getElementById('btn-magic')
      btn.disabled = true
      btn.textContent = 'Sending...'

      const { error } = await client.auth.signInWithOtp({
        email,
        options: { emailRedirectTo: window.location.origin + '/login.html' },
      })

      if (error) {
        btn.disabled = false
        btn.textContent = 'Send Magic Link'
        alert(error.message)
      } else {
        document.getElementById('magic-sent').style.display = 'block'
        btn.style.display = 'none'
      }
    })
  </script>
</body>
</html>
