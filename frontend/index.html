<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assessment Platform</title>
  <meta name="description" content="Assessment Platform — secure, proctored technical assessments.">
  <meta property="og:title" content="Assessment Platform">
  <meta property="og:description" content="Secure, browser-based proctored technical assessments.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://assessment-platform-x8dl.onrender.com/og-image.avif">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://assessment-platform-x8dl.onrender.com/og-image.avif">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="loading-screen">
    <div class="spinner"></div>
    <p class="text-muted">Loading...</p>
  </div>

  <script type="module">
    // Root redirect: admins → /admin/, candidates → /test/
    const token = localStorage.getItem('admin_token')
    if (token) {
      try {
        const res = await fetch('/api/auth/user', { headers: { Authorization: `Bearer ${token}` } })
        if (res.ok) {
          window.location.replace('/admin/')
          throw 0
        }
      } catch {}
      localStorage.removeItem('admin_token')
    }
    window.location.replace('/test/')
  </script>
</body>
</html>
