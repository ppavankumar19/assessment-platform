<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typing Playback — Assessment Platform</title>
  <link rel="stylesheet" href="/css/app.css">
  <!-- Monaco Editor via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
</head>
<body>
<div class="playback-container">
  <!-- Header -->
  <div class="playback-header">
    <a href="/admin/" class="btn btn-ghost btn-sm">&larr; Dashboard</a>
    <div>
      <h3 id="pb-candidate">Loading...</h3>
      <p class="text-sm text-muted" id="pb-session-info"></p>
    </div>
    <div class="flex items-center gap-2 ml-auto">
      <span id="pb-status-badge"></span>
      <button class="btn btn-danger btn-sm" id="btn-disqualify">Disqualify</button>
    </div>
  </div>

  <div class="playback-body">
    <!-- Sidebar: question selector + paste markers -->
    <div class="playback-sidebar">
      <div class="mb-4">
        <label class="mb-2" style="display:block">Question</label>
        <select class="select" id="pb-question-select"></select>
      </div>

      <h4 class="mb-2 text-sm">Snapshot Timeline</h4>
      <div id="pb-markers">
        <p class="text-sm text-muted">Select a question to see snapshots.</p>
      </div>

      <div class="sep"></div>
      <h4 class="mb-2 text-sm">Metrics</h4>
      <div id="pb-metrics" class="text-sm" style="line-height:2"></div>
    </div>

    <!-- Monaco Editor viewer -->
    <div class="playback-main">
      <div class="playback-editor" id="pb-editor"></div>

      <!-- Timeline slider -->
      <div class="playback-controls">
        <div class="flex items-center gap-3 mb-2">
          <button class="btn btn-outline btn-sm" id="pb-play">&#9654; Play</button>
          <span class="text-sm text-muted" id="pb-time">T+0s</span>
          <span class="text-sm text-muted" id="pb-trigger"></span>
        </div>
        <input type="range" id="pb-slider" min="0" max="100" value="0"
          style="width:100%;accent-color:var(--indigo-500);cursor:pointer">
        <div class="flex justify-between mt-1">
          <span class="text-xs text-muted" id="pb-start-label">Start</span>
          <span class="text-xs text-muted" id="pb-end-label">End</span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Confirm dialog -->
<div class="modal-backdrop" id="confirm-modal">
  <div class="modal confirm-dialog">
    <div class="modal-header"><span class="modal-title" id="confirm-title">Confirm</span></div>
    <p class="confirm-msg" id="confirm-msg"></p>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="confirm-cancel">Cancel</button>
      <button class="btn btn-danger" id="confirm-ok">Confirm</button>
    </div>
  </div>
</div>

<script type="module">
import api from '/js/api.js'
import { toastSuccess, toastError, confirm, statusBadge, formatDate } from '/js/utils.js'

const token = localStorage.getItem('admin_token')
if (!token) { window.location.replace('/login.html'); throw 0 }

const params = new URLSearchParams(location.search)
const sessionId = params.get('session')
if (!sessionId) { window.location.replace('/admin/'); throw 0 }

let session = null
let editor = null
let snapshots = []
let playInterval = null
let currentIdx = 0

// Init Monaco
require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' } })
require(['vs/editor/editor.main'], () => {
  editor = monaco.editor.create(document.getElementById('pb-editor'), {
    value: '',
    language: 'python',
    theme: 'vs-dark',
    readOnly: true,
    minimap: { enabled: false },
    fontSize: 14,
    scrollBeyondLastLine: false,
    wordWrap: 'on',
    lineNumbers: 'on',
    padding: { top: 12 },
  })
  loadSession()
})

async function loadSession() {
  try {
    session = await api.getSession(sessionId)

    document.getElementById('pb-candidate').textContent = session.candidate_name || 'Unknown'
    document.getElementById('pb-session-info').textContent =
      `${session.candidate_email || ''} · ${session.rounds?.title || ''} · Score: ${session.score ?? '—'}`
    document.getElementById('pb-status-badge').innerHTML = statusBadge(session.status)

    // Populate question selector
    const sel = document.getElementById('pb-question-select')
    sel.innerHTML = '<option value="">— Select question —</option>'
    session.submissions?.forEach((sub, i) => {
      const opt = document.createElement('option')
      opt.value = sub.id
      opt.textContent = `Question ${i+1} (Score: ${sub.score ?? 0})`
      sel.appendChild(opt)
    })

    if (session.submissions?.length === 1) {
      sel.value = session.submissions[0].id
      loadSubmission(session.submissions[0].id)
    }
  } catch (e) { toastError('Failed to load session: ' + e.message) }
}

document.getElementById('pb-question-select').addEventListener('change', e => {
  if (e.target.value) loadSubmission(e.target.value)
})

function loadSubmission(subId) {
  const sub = session.submissions?.find(s => s.id === subId)
  if (!sub) return

  const replay = sub.speed_metrics?.[0]?.keystroke_sample
  const metrics = sub.speed_metrics?.[0]

  // Show metrics
  const mEl = document.getElementById('pb-metrics')
  if (metrics) {
    mEl.innerHTML = `
      <div><span class="text-muted">Keystrokes:</span> ${metrics.total_keystrokes ?? '—'}</div>
      <div><span class="text-muted">Pastes:</span> <span class="${(metrics.paste_count||0)>0?'text-warning':''}">${metrics.paste_count ?? 0}</span></div>
      <div><span class="text-muted">Deletes:</span> ${metrics.delete_count ?? '—'}</div>
      <div><span class="text-muted">CPM:</span> ${metrics.chars_per_minute ?? '—'}</div>
      <div><span class="text-muted">WPM:</span> ${metrics.wpm_equivalent ?? '—'}</div>
    `
  } else {
    mEl.innerHTML = '<p class="text-muted">No metrics recorded.</p>'
  }

  if (!replay?.snapshots?.length) {
    editor?.setValue(sub.code || '// No replay data')
    document.getElementById('pb-markers').innerHTML = '<p class="text-sm text-muted">No replay snapshots available.</p>'
    document.getElementById('pb-slider').max = 0
    return
  }

  snapshots = replay.snapshots
  renderMarkers()
  setSnapshot(0)
  document.getElementById('pb-slider').max = snapshots.length - 1
  document.getElementById('pb-slider').value = 0
  document.getElementById('pb-start-label').textContent = 'T+0s'
  const last = snapshots[snapshots.length - 1]
  document.getElementById('pb-end-label').textContent = `T+${Math.round(last.t/1000)}s`
}

function renderMarkers() {
  const el = document.getElementById('pb-markers')
  el.innerHTML = snapshots.map((s, i) => {
    const color = s.trigger === 'paste' ? 'text-warning' :
                  s.trigger === 'run'   ? 'text-indigo'  :
                  s.trigger === 'submit'? 'text-success'  : 'text-muted'
    return `
      <div class="flex items-center gap-2 mb-1" style="cursor:pointer" onclick="goToSnapshot(${i})">
        <span class="text-xs ${color}">T+${Math.round(s.t/1000)}s</span>
        <span class="badge badge-gray" style="font-size:.7rem">${s.trigger}</span>
        ${s.pastedContent ? `<span class="text-xs text-warning">paste!</span>` : ''}
      </div>`
  }).join('')
}
window.goToSnapshot = i => {
  setSnapshot(i)
  document.getElementById('pb-slider').value = i
}

function setSnapshot(i) {
  if (!snapshots[i]) return
  currentIdx = i
  const s = snapshots[i]
  editor?.setValue(s.code || '')
  document.getElementById('pb-time').textContent = `T+${Math.round(s.t/1000)}s`
  document.getElementById('pb-trigger').textContent = s.trigger + (s.pastedContent ? ' (PASTE DETECTED)' : '')
  document.getElementById('pb-trigger').className = `text-sm ${s.trigger === 'paste' ? 'text-warning' : 'text-muted'}`
}

// Slider
document.getElementById('pb-slider').addEventListener('input', e => {
  setSnapshot(Number(e.target.value))
  stopPlay()
})

// Play button
document.getElementById('pb-play').addEventListener('click', () => {
  if (playInterval) { stopPlay(); return }
  document.getElementById('pb-play').textContent = '⏸ Pause'
  playInterval = setInterval(() => {
    if (currentIdx >= snapshots.length - 1) { stopPlay(); return }
    setSnapshot(currentIdx + 1)
    document.getElementById('pb-slider').value = currentIdx
  }, 500)
})

function stopPlay() {
  clearInterval(playInterval)
  playInterval = null
  document.getElementById('pb-play').textContent = '▶ Play'
}

// Disqualify
document.getElementById('btn-disqualify').addEventListener('click', () => {
  confirm(`Disqualify ${session?.candidate_name || 'this candidate'}?`, async () => {
    try {
      await api.disqualifySession(sessionId)
      toastSuccess('Candidate disqualified')
      document.getElementById('pb-status-badge').innerHTML = '<span class="badge badge-red">Disqualified</span>'
    } catch (e) { toastError(e.message) }
  }, 'Disqualify Candidate')
})
</script>
</body>
</html>
