<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Assessment Platform</title>
  <link rel="stylesheet" href="/css/app.css">
  <style>
    .round-card { transition: border-color .15s, box-shadow .15s; }
    .round-card:hover { border-color: var(--border-light); box-shadow: 0 4px 16px rgba(0,0,0,.07); }
    .round-card-title {
      font-size: 1rem; font-weight: 600; color: var(--text-50);
      text-decoration: none; transition: color .15s;
    }
    .round-card-title:hover { color: var(--indigo-500); }
    .round-card-actions {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: .5rem;
      margin-top: .875rem; padding-top: .875rem;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <span class="logo-icon">&#9670;</span> Assessment
    </div>
    <nav class="sidebar-nav">
      <a href="/admin/" class="active">&#128202; Dashboard</a>
      <a href="/admin/library.html">&#128218; Library</a>
      <a href="/test/" target="_blank">&#128100; Candidate View</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="avatar" id="user-avatar">A</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name" id="user-name">Admin</div>
          <div class="sidebar-user-role">Administrator</div>
        </div>
      </div>
      <button class="btn btn-ghost btn-sm w-full" id="btn-logout">&#8594; Sign out</button>
    </div>
  </aside>

  <main class="admin-content">
    <div class="content-header">
      <div class="flex items-center gap-3">
        <button class="sidebar-toggle" id="sidebar-toggle">&#9776;</button>
        <div>
          <h2>Dashboard</h2>
          <p class="text-xs text-muted mt-1" style="margin-top:.125rem">Manage assessment rounds and candidates</p>
        </div>
      </div>
      <button class="btn btn-primary" id="btn-new-round">+ New Round</button>
    </div>

    <div class="content-body">
      <!-- Stats -->
      <div class="grid-5 mb-6" id="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Total Rounds</div>
          <div class="stat-value" id="stat-rounds">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Published</div>
          <div class="stat-value green" id="stat-published">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Active Now</div>
          <div class="stat-value indigo" id="stat-active">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Sessions</div>
          <div class="stat-value" id="stat-sessions">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Drafts</div>
          <div class="stat-value amber" id="stat-drafts">—</div>
        </div>
      </div>

      <!-- Rounds list -->
      <div class="section">
        <div class="section-header">
          <h3>Assessment Rounds</h3>
        </div>
        <div id="rounds-list">
          <div class="empty-state"><div class="spinner"></div></div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- New Round Modal -->
<div class="modal-backdrop" id="modal-new-round">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Create New Round</span>
      <button class="modal-close" data-close="modal-new-round">&times;</button>
    </div>
    <form id="form-new-round">
      <div class="form-group">
        <label>Title *</label>
        <input type="text" class="input" name="title" placeholder="e.g. Python Output Prediction Round" required>
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea class="textarea" name="description" placeholder="Brief description of this assessment..."></textarea>
      </div>
      <div class="form-group">
        <label>Type *</label>
        <select class="select" name="round_type" required>
          <option value="output_prediction">Output Prediction</option>
          <option value="mcq">MCQ (Multiple Choice)</option>
          <option value="coding">Coding (write code)</option>
        </select>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label>Duration (minutes) *</label>
          <input type="number" class="input" name="duration_minutes" value="60" min="5" max="300" required>
        </div>
        <div class="form-group">
          <label>Cutoff Score</label>
          <input type="number" class="input" name="cutoff_score" placeholder="e.g. 70">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" data-close="modal-new-round">Cancel</button>
        <button type="submit" class="btn btn-primary" id="btn-create-round">Create Round</button>
      </div>
    </form>
  </div>
</div>

<!-- Edit Round Modal -->
<div class="modal-backdrop" id="modal-edit-round">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Edit Round</span>
      <button class="modal-close" data-close="modal-edit-round">&times;</button>
    </div>
    <form id="form-edit-round">
      <input type="hidden" name="id">
      <div class="form-group">
        <label>Title *</label>
        <input type="text" class="input" name="title" required>
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea class="textarea" name="description"></textarea>
      </div>
      <div class="form-group">
        <label>Type *</label>
        <select class="select" name="round_type" required>
          <option value="output_prediction">Output Prediction</option>
          <option value="mcq">MCQ (Multiple Choice)</option>
          <option value="coding">Coding (write code)</option>
        </select>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label>Duration (minutes) *</label>
          <input type="number" class="input" name="duration_minutes" min="5" max="300" required>
        </div>
        <div class="form-group">
          <label>Cutoff Score</label>
          <input type="number" class="input" name="cutoff_score" placeholder="e.g. 70">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" data-close="modal-edit-round">Cancel</button>
        <button type="submit" class="btn btn-primary" id="btn-save-round">Save Changes</button>
      </div>
    </form>
  </div>
</div>

<!-- Confirm dialog -->
<div class="modal-backdrop" id="confirm-modal">
  <div class="modal confirm-dialog">
    <div class="modal-header">
      <span class="modal-title" id="confirm-title">Confirm</span>
    </div>
    <p class="confirm-msg" id="confirm-msg"></p>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="confirm-cancel">Cancel</button>
      <button class="btn btn-danger" id="confirm-ok">Confirm</button>
    </div>
  </div>
</div>

<script type="module">
import api from '/js/api.js'
import { toastSuccess, toastError, openModal, closeModal, confirm, roundStatusBadge, roundTypeBadge, timeAgo, escHtml } from '/js/utils.js'

const token = localStorage.getItem('admin_token')
if (!token) { window.location.replace('/login.html'); throw 0 }

let user = null
let roundsCache = {}

document.querySelectorAll('[data-close]').forEach(btn => {
  btn.addEventListener('click', () => closeModal(btn.dataset.close))
})

document.getElementById('sidebar-toggle')?.addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open')
})

async function loadUser() {
  try {
    user = await api.getUser()
    document.getElementById('user-name').textContent = user.full_name || user.email
    const av = document.getElementById('user-avatar')
    if (user.avatar_url) {
      av.innerHTML = `<img src="${user.avatar_url}" alt="">`
    } else {
      av.textContent = (user.full_name || user.email || 'A')[0].toUpperCase()
    }
  } catch {
    window.location.replace('/login.html')
  }
}

document.getElementById('btn-logout').addEventListener('click', async () => {
  localStorage.removeItem('admin_token')
  window.location.replace('/login.html')
})

async function loadRounds() {
  try {
    const rounds = await api.getRounds()

    document.getElementById('stat-rounds').textContent    = rounds.length
    document.getElementById('stat-published').textContent = rounds.filter(r => r.is_published).length
    document.getElementById('stat-active').textContent    = rounds.filter(r => r.is_active).length
    document.getElementById('stat-drafts').textContent    = rounds.filter(r => !r.is_published).length

    const allSessions = rounds.reduce((n, r) => n + (r.candidate_sessions?.[0]?.count || 0), 0)
    document.getElementById('stat-sessions').textContent = allSessions

    renderRounds(rounds)
  } catch (e) {
    toastError('Failed to load rounds: ' + e.message)
  }
}

function renderRounds(rounds) {
  const container = document.getElementById('rounds-list')
  if (rounds.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="icon">&#128221;</div>
        <p style="font-size:.9375rem;font-weight:500;color:var(--text-300);margin-bottom:.25rem">No rounds yet</p>
        <p>Create your first assessment round to get started.</p>
      </div>`
    return
  }

  roundsCache = {}
  container.innerHTML = rounds.map(r => {
    roundsCache[r.id] = r
    const sessionCount = r.candidate_sessions?.[0]?.count || 0

    const publishBtn = !r.is_published
      ? `<button class="btn btn-success btn-sm" onclick="publishRound('${r.id}')">Publish</button>`
      : r.is_active
        ? `<button class="btn btn-ghost btn-sm" onclick="pauseRound('${r.id}')">Pause</button>
           <button class="btn btn-ghost btn-sm" onclick="unpublishRound('${r.id}')">Unpublish</button>`
        : `<button class="btn btn-success btn-sm" onclick="publishRound('${r.id}')">Republish</button>
           <button class="btn btn-ghost btn-sm" onclick="unpublishRound('${r.id}')">Unpublish</button>`

    return `
    <div class="round-card card mb-3">
      <div class="flex items-start gap-3">
        <div style="flex:1;min-width:0">
          <div class="flex items-center gap-2 flex-wrap">
            <a href="/admin/round.html?id=${r.id}" class="round-card-title">${escHtml(r.title)}</a>
            ${roundTypeBadge(r.round_type)}
            ${roundStatusBadge(r)}
          </div>
          ${r.description ? `<p class="text-sm mt-1" style="color:var(--text-400);line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">${escHtml(r.description)}</p>` : ''}
          <div class="flex items-center gap-2 mt-2" style="flex-wrap:wrap">
            <span class="text-xs" style="color:var(--text-500)">${sessionCount} session${sessionCount !== 1 ? 's' : ''}</span>
            <span style="color:var(--border-light)">&middot;</span>
            <span class="text-xs" style="color:var(--text-500)">${r.duration_minutes} min</span>
            <span style="color:var(--border-light)">&middot;</span>
            <span class="text-xs" style="color:var(--text-500)">Created ${timeAgo(r.created_at)}</span>
          </div>
        </div>
      </div>
      <div class="round-card-actions">
        <div class="flex items-center gap-2">
          <a href="/admin/round.html?id=${r.id}" class="btn btn-outline btn-sm">Manage</a>
          <button class="btn btn-ghost btn-sm" onclick="openEditRound('${r.id}')">Edit</button>
        </div>
        <div class="flex items-center gap-2">
          ${publishBtn}
          <button class="btn btn-sm" style="background:transparent;border:1px solid var(--border);color:var(--red-500);font-size:.8125rem;padding:.3125rem .75rem;border-radius:var(--radius);cursor:pointer;font-weight:500;transition:all .15s" onmouseover="this.style.background='rgba(220,38,38,.06)';this.style.borderColor='var(--red-400)'" onmouseout="this.style.background='transparent';this.style.borderColor='var(--border)'" onclick="deleteRound('${r.id}', '${escHtml(r.title)}')">Delete</button>
        </div>
      </div>
    </div>`
  }).join('')
}

document.getElementById('btn-new-round').addEventListener('click', () => openModal('modal-new-round'))

document.getElementById('form-new-round').addEventListener('submit', async e => {
  e.preventDefault()
  const fd = new FormData(e.target)
  const body = {
    title:            fd.get('title'),
    description:      fd.get('description') || null,
    round_type:       fd.get('round_type'),
    duration_minutes: Number(fd.get('duration_minutes')),
    cutoff_score:     fd.get('cutoff_score') ? Number(fd.get('cutoff_score')) : null,
  }
  const btn = document.getElementById('btn-create-round')
  btn.disabled = true
  btn.textContent = 'Creating...'
  try {
    const round = await api.createRound(body)
    toastSuccess('Round created!')
    closeModal('modal-new-round')
    e.target.reset()
    window.location.href = `/admin/round.html?id=${round.id}`
  } catch (err) {
    toastError(err.message)
  } finally {
    btn.disabled = false
    btn.textContent = 'Create Round'
  }
})

window.deleteRound = (id, title) => {
  confirm(`Delete round "${title}"? All questions and sessions will be permanently removed.`, async () => {
    try {
      await api.deleteRound(id)
      toastSuccess('Round deleted')
      loadRounds()
    } catch (e) {
      toastError(e.message)
    }
  }, 'Delete Round')
}

window.publishRound = async (id) => {
  try { await api.publishRound(id); toastSuccess('Round published'); loadRounds() }
  catch (e) { toastError(e.message) }
}

window.unpublishRound = async (id) => {
  try { await api.unpublishRound(id); toastSuccess('Round unpublished'); loadRounds() }
  catch (e) { toastError(e.message) }
}

window.pauseRound = async (id) => {
  try { await api.pauseRound(id); toastSuccess('Round paused'); loadRounds() }
  catch (e) { toastError(e.message) }
}

window.openEditRound = (id) => {
  const r = roundsCache[id]
  if (!r) return
  const form = document.getElementById('form-edit-round')
  form.id.value               = r.id
  form.title.value            = r.title
  form.description.value      = r.description || ''
  form.round_type.value       = r.round_type
  form.duration_minutes.value = r.duration_minutes
  form.cutoff_score.value     = r.cutoff_score ?? ''
  openModal('modal-edit-round')
}

document.getElementById('form-edit-round').addEventListener('submit', async e => {
  e.preventDefault()
  const fd = new FormData(e.target)
  const id = fd.get('id')
  const btn = document.getElementById('btn-save-round')
  btn.disabled = true; btn.textContent = 'Saving...'
  try {
    await api.updateRound(id, {
      title:            fd.get('title'),
      description:      fd.get('description') || null,
      round_type:       fd.get('round_type'),
      duration_minutes: Number(fd.get('duration_minutes')),
      cutoff_score:     fd.get('cutoff_score') ? Number(fd.get('cutoff_score')) : null,
    })
    toastSuccess('Round updated')
    closeModal('modal-edit-round')
    loadRounds()
  } catch (err) {
    toastError(err.message)
  } finally {
    btn.disabled = false; btn.textContent = 'Save Changes'
  }
})

await loadUser()
await loadRounds()
</script>
</body>
</html>
