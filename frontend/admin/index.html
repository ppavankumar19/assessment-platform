<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Assessment Platform</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="admin-layout">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <span class="logo-icon">&#9670;</span> Assessment
    </div>
    <nav class="sidebar-nav">
      <a href="/admin/" class="active">&#128202; Dashboard</a>
      <a href="/test/" target="_blank">&#128100; Candidate View</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="avatar" id="user-avatar">A</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name" id="user-name">Admin</div>
          <div class="sidebar-user-role">Admin</div>
        </div>
      </div>
      <button class="btn btn-ghost btn-sm w-full" id="btn-logout">Sign out</button>
    </div>
  </aside>

  <!-- Main content -->
  <main class="admin-content">
    <div class="content-header">
      <div class="flex items-center gap-3">
        <button class="sidebar-toggle" id="sidebar-toggle">&#9776;</button>
        <div>
          <h2>Dashboard</h2>
          <p class="text-sm text-muted mt-1">Manage assessment rounds</p>
        </div>
      </div>
      <button class="btn btn-primary" id="btn-new-round">+ New Round</button>
    </div>

    <div class="content-body">
      <!-- Stats -->
      <div class="grid-5 mb-6" id="stats-grid">
        <div class="stat-card"><div class="stat-label">Total Rounds</div><div class="stat-value" id="stat-rounds">—</div></div>
        <div class="stat-card"><div class="stat-label">Published</div><div class="stat-value green" id="stat-published">—</div></div>
        <div class="stat-card"><div class="stat-label">Total Sessions</div><div class="stat-value indigo" id="stat-sessions">—</div></div>
        <div class="stat-card"><div class="stat-label">Completed</div><div class="stat-value green" id="stat-completed">—</div></div>
        <div class="stat-card"><div class="stat-label">Disqualified</div><div class="stat-value red" id="stat-disq">—</div></div>
      </div>

      <!-- Rounds list -->
      <div class="section">
        <div class="section-header">
          <h3>Rounds</h3>
        </div>
        <div id="rounds-list">
          <div class="empty-state"><div class="spinner"></div></div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- New Round Modal -->
<div class="modal-backdrop" id="modal-new-round">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Create New Round</span>
      <button class="modal-close" data-close="modal-new-round">&times;</button>
    </div>
    <form id="form-new-round">
      <div class="form-group">
        <label>Title *</label>
        <input type="text" class="input" name="title" placeholder="e.g. Python Coding Round 1" required>
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea class="textarea" name="description" placeholder="Brief description..."></textarea>
      </div>
      <div class="form-group">
        <label>Type *</label>
        <select class="select" name="round_type" required>
          <option value="live_coding">Live Coding</option>
          <option value="output_prediction">Output Prediction</option>
          <option value="mcq">MCQ</option>
        </select>
      </div>
      <div class="form-group">
        <label>Duration (minutes) *</label>
        <input type="number" class="input" name="duration_minutes" value="60" min="5" max="300" required>
      </div>
      <div class="form-group">
        <label>Cutoff Score (optional)</label>
        <input type="number" class="input" name="cutoff_score" placeholder="e.g. 70">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" data-close="modal-new-round">Cancel</button>
        <button type="submit" class="btn btn-primary" id="btn-create-round">Create Round</button>
      </div>
    </form>
  </div>
</div>

<!-- Confirm dialog -->
<div class="modal-backdrop" id="confirm-modal">
  <div class="modal confirm-dialog">
    <div class="modal-header">
      <span class="modal-title" id="confirm-title">Confirm</span>
    </div>
    <p class="confirm-msg" id="confirm-msg"></p>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="confirm-cancel">Cancel</button>
      <button class="btn btn-danger" id="confirm-ok">Confirm</button>
    </div>
  </div>
</div>

<script type="module">
import api from '/js/api.js'
import { toastSuccess, toastError, openModal, closeModal, confirm, formatDate, roundStatusBadge, roundTypeBadge, timeAgo } from '/js/utils.js'

// Auth guard
const token = localStorage.getItem('admin_token')
if (!token) { window.location.replace('/login.html'); throw 0 }

let user = null

// Close buttons
document.querySelectorAll('[data-close]').forEach(btn => {
  btn.addEventListener('click', () => closeModal(btn.dataset.close))
})

// Sidebar toggle (mobile)
document.getElementById('sidebar-toggle')?.addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open')
})

// Load user
async function loadUser() {
  try {
    user = await api.getUser()
    document.getElementById('user-name').textContent = user.full_name || user.email
    const av = document.getElementById('user-avatar')
    if (user.avatar_url) {
      av.innerHTML = `<img src="${user.avatar_url}" alt="">`
    } else {
      av.textContent = (user.full_name || user.email || 'A')[0].toUpperCase()
    }
  } catch {
    window.location.replace('/login.html')
  }
}

// Logout
document.getElementById('btn-logout').addEventListener('click', async () => {
  localStorage.removeItem('admin_token')
  window.location.replace('/login.html')
})

// Load rounds and stats
async function loadRounds() {
  try {
    const rounds = await api.getRounds()

    // Stats
    document.getElementById('stat-rounds').textContent = rounds.length
    document.getElementById('stat-published').textContent = rounds.filter(r => r.is_published).length

    const allSessions = rounds.reduce((n, r) => n + (r.candidate_sessions?.[0]?.count || 0), 0)
    document.getElementById('stat-sessions').textContent = allSessions

    renderRounds(rounds)
  } catch (e) {
    toastError('Failed to load rounds: ' + e.message)
  }
}

async function loadSessionStats() {
  // Fetch counts for completed/disqualified
  try {
    const res = await fetch('/api/admin/rounds', { headers: { Authorization: `Bearer ${token}` } })
    // Already loaded above, skip separate call
  } catch {}
}

function renderRounds(rounds) {
  const container = document.getElementById('rounds-list')
  if (rounds.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="icon">&#128221;</div><p>No rounds yet. Create your first assessment round.</p></div>`
    return
  }

  container.innerHTML = rounds.map(r => {
    const sessionCount = r.candidate_sessions?.[0]?.count || 0
    return `
    <div class="card mb-3" style="cursor:default">
      <div class="flex items-center justify-between flex-wrap gap-3">
        <div class="flex items-center gap-3 flex-wrap">
          <a href="/admin/round.html?id=${r.id}" class="font-semibold" style="font-size:1.0625rem;color:var(--text-50);text-decoration:none;">${escHtml(r.title)}</a>
          ${roundStatusBadge(r)}
          ${roundTypeBadge(r.round_type)}
        </div>
        <div class="flex items-center gap-2">
          <span class="text-sm text-muted">${sessionCount} session${sessionCount !== 1 ? 's' : ''}</span>
          <span class="text-sm text-muted">&#183;</span>
          <span class="text-sm text-muted">${r.duration_minutes} min</span>
          <a href="/admin/round.html?id=${r.id}" class="btn btn-outline btn-sm">Manage</a>
          <button class="btn btn-ghost btn-sm" onclick="deleteRound('${r.id}', '${escHtml(r.title)}')">Delete</button>
        </div>
      </div>
      ${r.description ? `<p class="text-sm text-muted mt-2">${escHtml(r.description)}</p>` : ''}
      <p class="text-xs text-muted mt-2">Created ${timeAgo(r.created_at)}</p>
    </div>`
  }).join('')
}

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}

// Create round
document.getElementById('btn-new-round').addEventListener('click', () => openModal('modal-new-round'))

document.getElementById('form-new-round').addEventListener('submit', async e => {
  e.preventDefault()
  const fd = new FormData(e.target)
  const body = {
    title:            fd.get('title'),
    description:      fd.get('description') || null,
    round_type:       fd.get('round_type'),
    duration_minutes: Number(fd.get('duration_minutes')),
    cutoff_score:     fd.get('cutoff_score') ? Number(fd.get('cutoff_score')) : null,
  }
  const btn = document.getElementById('btn-create-round')
  btn.disabled = true
  btn.textContent = 'Creating...'
  try {
    const round = await api.createRound(body)
    toastSuccess('Round created!')
    closeModal('modal-new-round')
    e.target.reset()
    window.location.href = `/admin/round.html?id=${round.id}`
  } catch (err) {
    toastError(err.message)
  } finally {
    btn.disabled = false
    btn.textContent = 'Create Round'
  }
})

// Delete round
window.deleteRound = (id, title) => {
  confirm(`Delete round "${title}"? All questions and sessions will be permanently removed.`, async () => {
    try {
      await api.deleteRound(id)
      toastSuccess('Round deleted')
      loadRounds()
    } catch (e) {
      toastError(e.message)
    }
  }, 'Delete Round')
}

await loadUser()
await loadRounds()
</script>
</body>
</html>
